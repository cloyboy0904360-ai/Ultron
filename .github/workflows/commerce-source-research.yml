name: ULTRON Read-only Commerce Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect configured read-only sources
        run: python scripts/run_commerce_sources.py --config config/commerce_sources.json --output commerce_source_report.json

      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultron-commerce-source-evidence-${{ github.run_id }}
          path: commerce_source_report.json
          if-no-files-found: warn
          retention-days: 14

name: Controller

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run the master controller
        env:
          GH_TOKEN: ${{ github.token }}
          ULTRON_DB: data/controller.db
          ULTRON_CYCLE_REPORT: data/controller-cycle.json
          ULTRON_GITHUB_OWNER: cloyboy0904360-ai
          ULTRON_GITHUB_REPO: Ultron
        run: python -m ultron.controller

      - name: Upload cycle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controller-cycle
          path: data/controller-cycle.json

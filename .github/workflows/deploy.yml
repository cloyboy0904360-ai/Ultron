name: Controlled Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Validate before deploy
        run: |
          ruff check .
          pytest -q
          python scripts/validate_repository.py

      - name: Backup notice
        run: echo "Create/verify backup snapshot before release promotion."

      - name: Deploy placeholder gate
        run: echo "Deployment command should be added when runtime target is available."
